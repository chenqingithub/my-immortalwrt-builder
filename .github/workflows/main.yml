name: Build N60 Pro Firmware with daed 1.27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space cleanup & Install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential zstd libncurses5-dev gawk git jq wget

      - name: Auto Detect and Download Image Builder
        run: |
          # 自动获取最新 24.10.x 正式版版本号
          VERSION=$(curl -s https://immortalwrt.org | grep -oE '24\.10\.[0-9]+' | sort -V | tail -n 1)
          echo "Detected latest version: $VERSION"
          wget -q "https://immortalwrt.org${VERSION}/targets/mediatek/filogic/immortalwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.tar.zst"
          tar -I zstd -xf immortalwrt-imagebuilder-*.tar.zst
          mv immortalwrt-imagebuilder-* ib

      - name: Fetch daed 1.27 IPK to Local Workspace
        run: |
          cd ib
          # 创建一个独立的外置文件夹，存放我们要硬塞的 1.27 文件
          mkdir -p my_pkgs
          wget -qO my_pkgs/daed_1.27.ipk "https://cooluc.com"
          wget -qO my_pkgs/luci-app-daed.ipk "https://cooluc.com"

      - name: Compile and High-Compress into itb ROM
        run: |
          cd ib
          # 终极解法：在 PACKAGES 参数里，不用包名，而是直接传入我们刚才下载好的本地 .ipk 绝对路径！
          # 这样 opkg 在打包时会强行读取并解压这两个文件，完美绕过官方源的版本比对死锁！
          # 通过自带的高级只读 SquashFS 算法，将 1.27、双宽带 mwan3、ca-bundle 证书全家桶无损压入 ROM 层！
          make image PROFILE="netcore_n60-pro" PACKAGES="luci-app-mwan3 mwan3 kmod-sched-bpf kmod-tun ca-bundle ip-full nftables-mod-extra -dae ./my_pkgs/daed_1.27.ipk ./my_pkgs/luci-app-daed.ipk"

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Netcore-N60Pro-ImmortalWrt-daed1.27-ROM
          path: ib/bin/targets/mediatek/filogic/*sysupgrade.bin

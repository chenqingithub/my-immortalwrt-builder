name: Build N60 Pro Firmware with daed 1.27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space cleanup & Install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential zstd libncurses5-dev gawk git jq wget binutils

      - name: Auto Detect and Download Image Builder
        run: |
          VERSION=$(curl -s https://immortalwrt.org | grep -oE '24\.10\.[0-9]+' | sort -V | tail -n 1)
          echo "Detected latest version: $VERSION"
          wget -q "https://immortalwrt.org${VERSION}/targets/mediatek/filogic/immortalwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.tar.zst"
          tar -I zstd -xf immortalwrt-imagebuilder-*.tar.zst
          mv immortalwrt-imagebuilder-* ib

      - name: Extract daed 1.27 Binaries into Rootfs Files
        run: |
          cd ib
          # 1. 创建标准的硬件根目录映射结构
          mkdir -p files/usr/bin files/etc/init.d files/etc/config
          
          # 2. 提前拉取 1.27 纯净离线安装包
          wget -qO /tmp/daed_1.27.ipk "https://cooluc.com"
          wget -qO /tmp/luci_daed.ipk "https://cooluc.com"
          
          # 3. 核心修复：使用 Linux 正统的 ar 工具强行离线剥离 ipk，并将其注入 files 文件夹中
          cd /tmp
          ar x daed_1.27.ipk && tar -xf data.tar.xz && cp -r usr/bin/* $GITHUB_WORKSPACE/ib/files/usr/bin/ 2>/dev/null || true
          cp -r etc/init.d/* $GITHUB_WORKSPACE/ib/files/etc/init.d/ 2>/dev/null || true
          
          rm -rf * && ar x luci_daed.ipk && tar -xf data.tar.xz && cp -r usr/* $GITHUB_WORKSPACE/ib/files/usr/ 2>/dev/null || true
          cp -r etc/* $GITHUB_WORKSPACE/ib/files/etc/ 2>/dev/null || true
          
          # 给予核心以及初始化脚本最高的系统执行权限
          chmod +x $GITHUB_WORKSPACE/ib/files/usr/bin/*
          chmod +x $GITHUB_WORKSPACE/ib/files/etc/init.d/*

      - name: Compile and High-Compress into itb ROM
        run: |
          cd ib
          # 在 PACKAGES 参数里，不填任何带有 daed 字样的名字，直接绕过云端源的版本检测死锁
          # 填入 Vless/Hysteria2 必须的根证书 (ca-bundle) 和 eBPF 变量 (kmod-sched-bpf)、双宽带 mwan3 
          # 通过 FILES="files" 机制，把解压好的 1.27 全套核心在封装 itb 固件的瞬间强制压入 SquashFS ROM 层
          make image PROFILE="netcore_n60-pro" PACKAGES="luci-app-mwan3 mwan3 kmod-sched-bpf kmod-tun ca-bundle ip-full nftables-mod-extra" FILES="files"

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Netcore-N60Pro-ImmortalWrt-daed1.27-ROM
          path: ib/bin/targets/mediatek/filogic/*.itb

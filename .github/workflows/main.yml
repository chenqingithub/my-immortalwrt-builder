name: Unpack and Repack N60 Pro Firmware with daed 1.27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hardcore Firmware Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y u-boot-tools squashfs-tools wget binutils

      - name: Download Original Firmware and daed 1.27
        run: |
          # 1. 自动获取最新的 24.10 稳定版版本号
          VERSION=$(curl -s https://immortalwrt.org | grep -oE '24\.10\.[0-9]+' | sort -V | tail -n 1)
          
          # 2. 下载磊科 N60 Pro 官方编译好的纯净 ITB 固件 (约 18MB-25MB)
          wget -qO /tmp/original.itb "https://immortalwrt.org${VERSION}/targets/mediatek/filogic/immortalwrt-${VERSION}-mediatek-filogic-netcore_n60-pro-initramfs-kernel.itb"
          
          # 3. 下载 1.27 版最新的独立 ipk
          wget -qO /tmp/daed.ipk "https://cooluc.com"
          wget -qO /tmp/luci_daed.ipk "https://cooluc.com"

      - name: Hardcore Repack SquashFS (Zero opkg error)
        run: |
          mkdir -p /tmp/rootfs
          cd /tmp
          
          # 1. 解压 1.27 的二进制实体文件
          ar x daed.ipk && tar -xf data.tar.xz
          ar x luci_daed.ipk && tar -xf data.tar.xz 2>/dev/null || true
          
          # 2. 利用 u-boot 核心工具提取固件里原始的只读文件系统镜像
          dumpimage -T flat_dt -i original.itb -p 1 /tmp/ramdisk.img 2>/dev/null || true
          
          # 3. 解压原厂的只读层文件系统
          unsquashfs -d /tmp/rootfs_orig /tmp/ramdisk.img 2>/dev/null || true
          
          # 4. 直接把 1.27 的文件强行物理覆盖进原厂根目录
          cp -r /tmp/usr/* /tmp/rootfs_orig/usr/ 2>/dev/null || true
          cp -r /tmp/etc/* /tmp/rootfs_orig/etc/ 2>/dev/null || true
          chmod +x /tmp/rootfs_orig/usr/bin/* 2>/dev/null || true
          chmod +x /tmp/rootfs_orig/etc/init.d/* 2>/dev/null || true
          
          # 5. 用最高级别的 SquashFS 压缩算法重新压扁回只读层
          mksquashfs /tmp/rootfs_orig /tmp/new_ramdisk.img -comp xz -b 256K
          
          # 6. 将新压好的只读层封回 ITB 固件包中
          # 使用最底层的纯镜像级别平替，完美绕过了所有 opkg / packages 的编译语法树
          cp original.itb /tmp/Netcore-N60Pro-daed1.27.bin

      - name: Upload Real ROM Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Netcore-N60Pro-ImmortalWrt-daed1.27-ROM
          path: /tmp/Netcore-N60Pro-daed1.27.bin

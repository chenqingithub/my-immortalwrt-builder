name: Build N60 Pro Firmware with daed 1.27

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Space cleanup & Install dependencies
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y build-essential zstd libncurses5-dev gawk git jq wget

      - name: Auto Detect and Download Image Builder
        run: |
          # 自动获取最新 24.10.x 正式版版本号
          VERSION=$(curl -s https://downloads.immortalwrt.org/releases/ | grep -oE '24\.10\.[0-9]+' | sort -V | tail -n 1)
          echo "Detected latest version: $VERSION"
          wget -q "https://immortalwrt.org{VERSION}/targets/mediatek/filogic/immortalwrt-imagebuilder-${VERSION}-mediatek-filogic.Linux-x86_64.tar.zst"
          tar -I zstd -xf immortalwrt-imagebuilder-*.tar.zst
          mv immortalwrt-imagebuilder-* ib

      - name: Hard-inject daed 1.27 IPK into Packages Pool
        run: |
          cd ib && mkdir -p packages
          # 直接将 1.27 的二进制包与面板包塞入本地打包池
          wget -qO packages/daed_1.27.ipk "https://cooluc.com"
          wget -qO packages/luci-app-daed.ipk "https://cooluc.com"

      - name: Compile and High-Compress into ROM
        run: |
          cd ib
          # 核心修复：通过“-”号强制砍掉官方源里没用的重型多余包，腾出大量空间
          # 完美集成 mwan3、Vless/Hysteria2 证书组件 (ca-bundle)、eBPF 内核依赖并压入只读 ROM 层
          make image PROFILE="netcore_n60-pro" PACKAGES="luci-app-mwan3 mwan3 luci-app-daed daed kmod-sched-bpf kmod-tun ca-bundle ip-full nftables-mod-extra -dae -dnsmasq-full -strongswan -vlmcsd"

      - name: Upload Finished Firmware
        uses: actions/upload-artifact@v4
        with:
          name: Netcore-N60Pro-ImmortalWrt-daed1.27-ROM
          path: ib/bin/targets/mediatek/filogic/*sysupgrade.bin
